<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Номын сан</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .message {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>📚 Миний номын сан</h1>

    <form id="bookForm">
        <h2>Шинэ ном нэмэх</h2>

        <label>Номын нэр:</label>
        <input
            type="text"
            id="title"
            placeholder="Жишээ: Animal Farm"
            required
        >

        <label>Зохиогч:</label>
        <input
            type="text"
            id="author"
            placeholder="Жишээ: George Orwell"
            required
        >

        <button type="submit">Ном нэмэх</button>

        <div class="message" id="message"></div>
    </form>

    <h2>📖 Номын жагсаалт</h2>

    <ul id="bookList"></ul>

    <script>
        // Номын жагсаалт авах
        async function loadBooks() {
            try {
                const response = await fetch("/books");
                const books = await response.json();

                const bookList = document.getElementById("bookList");

                bookList.innerHTML = "";

                books.forEach(book => {
                    const li = document.createElement("li");

                    li.innerHTML = `
                        <strong>${book.title}</strong>
                        <br>
                        Зохиогч: ${book.author}
                    `;

                    bookList.appendChild(li);
                });

            } catch (error) {
                console.error(error);
            }
        }

        // Шинэ ном нэмэх
        document
            .getElementById("bookForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const title = document.getElementById("title").value;
                const author = document.getElementById("author").value;

                try {
                    const response = await fetch("/books", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            title: title,
                            author: author
                        })
                    });

                    const result = await response.json();

                    const message =
                        document.getElementById("message");

                    if (response.ok) {
                        message.textContent = "✅ Ном амжилттай нэмэгдлээ!";

                        document.getElementById("bookForm").reset();

                        loadBooks();
                    } else {
                        message.textContent =
                            "❌ " + result.message;
                    }

                } catch (error) {
                    console.error(error);
                    document.getElementById("message").textContent =
                        "❌ Сервертэй холбогдож чадсангүй.";
                }
            });

        // Хуудас нээгдэхэд номнуудыг авах
        loadBooks();
    </script>

</body>
</html>
